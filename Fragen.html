<!DOCTYPE html>
<head>
  <title>Fragen</title>
  <style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #0d1117;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden; 
  }

  #frage-div {
    background: #1c2128;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  h3 {
    font-size: 1.4rem;
    margin-top: 0;
    margin-bottom: 25px;
    color: #00ffcc;
  }

  button {
    display: block; 
    width: 100%;
    padding: 18px;
    margin-bottom: 12px;
    background-color: #2d333b;
    color: white;
    border: 2px solid #444c56;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    
    -webkit-tap-highlight-color: transparent; 
    
    transition: transform 0.1s ease, background-color 0.1s ease;
  }

  button:active {
    background-color: #444c56;
    border-color: #00ffcc;
    transform: scale(0.97);
  }

  @media (max-width: 600px) {
    input, button {
      font-size: 16px; 
    }
  }
</style>
</head>
<body>
  <div id="frage-div"></div>
  <script>
    if(!sessionStorage.getItem("Raketenanzahl")){ //wenn Raketenanzahl nicht gefunden wurde
      sessionStorage.setItem("Raketenanzahl", "10");
    }
    const fragen = [
      ['Aus welcher Sprache kommt der Name von Silicium?',["Latein", "Griechisch", "Schwedisch"], 0],
      ['Welche Ordnungszahl hat Silicium?',["17", "23", "14"], 2],
      ['Wie hoch ist der Siedepunkt in Grad Celsius?',["3126", "3260", "2678"], 1],
      ['Wo wird Silicium für die Energiegewinnung genutzt?',["Windenergie", "Fusionsenergie", "Solarenergie"], 2],
      ['Aus was wird Silicium Nahrungsergänzungsmittel hergestellt?',["Efeu", "Bambus", "Stechpalme"], 1],
      ['Wann wurde zum ersten Mal reines Silicium hergestellt?',["1824", "1845", "1832"], 0]
      ];

    let aktuellerIndex = 0; // Fragennummer
    const frageDiv = document.getElementById("frage-div");
  
  function zeigeFrage(){
    frageDiv.innerHTML = ""; //Div leeren

    if(aktuellerIndex >= fragen.length){
      sessionStorage.setItem("quizGemacht", "true");
      window.location.replace("index.html");      
      return;
    }
    let frage = fragen[aktuellerIndex]
    let frageStellung = frage[0];
    let antwortmöglichkeiten = frage[1];
    let richtigeAntwort = frage[2];
  
    let  frageText = document.createElement("h3"); // Frage als h3 stellen
    frageText.textContent = frageStellung;
    frageDiv.appendChild(frageText);
  
    antwortmöglichkeiten.forEach(function(antwort, index){   //zeigt Antwortmöglichkeiten als Buttons
    let btn = document.createElement("button");
    btn.textContent = antwort;
    btn.onclick = function(){
      if (index === richtigeAntwort){
        let aktuelleRaketen = parseInt(sessionStorage.getItem("Raketenanzahl"))+10 || 0;
        sessionStorage.setItem("Raketenanzahl", aktuelleRaketen.toString());
        alert("Richtig! Du hast jetzt "+aktuelleRaketen+" Raketen");
        aktuellerIndex++;
      }else{
        let aktuelleRaketen = parseInt(sessionStorage.getItem("Raketenanzahl"))-5 || 0;
        sessionStorage.setItem("Raketenanzahl", aktuelleRaketen.toString());
        alert("Falsch");       
      }
    };
      frageDiv.appendChild(btn);
    });
  }
    zeigeFrage();
  
  </script>
</body>
</html>
