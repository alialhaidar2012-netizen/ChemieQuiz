<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChemieQuiz</title>
  <style>
    body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
    body { margin: 0; overflow: hidden; background: black; }
    #startScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #111; color: white; z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }
    #fireBtn {
  /* 1. Positionierung (Unten rechts, wo der Daumen ruht) */
  position: fixed;
  bottom: 30px;
  right: 30px;
  z-index: 1000;
  
  /* 2. Größe & Form (Groß genug für den Daumen) */
  width: 90px;
  height: 90px;
  border-radius: 50%; /* Macht den Button komplett rund */
  
  /* 3. Farben & Optik */
  background-color: rgba(255, 68, 68, 0.8); /* Halbtransparentes Rot */
  color: white;
  border: 3px solid #ff4c4c;
  font-size: 18px;
  font-weight: bold;
  font-family: 'Segoe UI', sans-serif;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  
  /* 4. Touch-Optimierungen für Handys */
  -webkit-tap-highlight-color: transparent; /* Kein grauer Kasten beim Tippen */
  touch-action: manipulation; /* Verhindert versehentliches Zoomen beim schnellen Tippen */
  outline: none;
  
  /* 5. Animation für das Drücken */
  transition: transform 0.1s ease, background-color 0.1s ease;
}

/* Der "Drück-Effekt" */
#fireBtn:active {
  background-color: rgba(255, 0, 0, 1); /* Volles Rot beim Drücken */
  transform: scale(0.9); /* Button zieht sich zusammen (fühlt sich an wie ein echter Knopf) */
}
    #startBtn {
      padding: 20px 40px; font-size: 24px; cursor: pointer;
      background: #4488ff; color: white; border: none; border-radius: 10px;
    }
    canvas {
  display: block;
}
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #00ffcc; /* Ein cooles Neon-Cyan */
  font-size: 30px;
  font-family: monospace;
  pointer-events: none; /* GANZ WICHTIG: Damit man "durch" das Kreuz klicken kann */
  z-index: 1000;
  display: none; /* Erstmal versteckt, bis das Spiel startet */
}
  </style>
</head>
<body>
  <div id="startScreen">
    <div style="text-align: center;">
      <h1 id="loadingText" style="color: white; background-color: black; font-size: 30px;font-family: sans-serif;">LÄDT...</h1>
    <button id="startBtn" style="display: none;">Spiel Starten</button>
    </div>
    </div>
  <button id="fireBtn">SHOOT</button>
<div id="crosshair">+</div>
  <script> if(!sessionStorage.getItem("quizGemacht")) window.location.replace("Fragen.html");</script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script src="main.js" type="module"></script>
</body>
</html>
